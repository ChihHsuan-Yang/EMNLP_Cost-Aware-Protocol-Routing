# Broadcast protocol -- multi-agent deliberation.
#
# PROVENANCE. Transcribed from the AgentVerse execution configs and code that
# produced the released outcomes; `source:` keys give repository-relative
# paths. Nothing is inferred. Unestablished fields carry `unknown: true`.
#
# THIS FILE DOES NOT EXECUTE ANYTHING (offline analysis package).

protocol_id: broadcast
display_name: Broadcast
description: >-
  Three peer deliberators with different temperaments discuss the problem on a
  shared transcript. Each turn all three are polled for a desire-to-speak score
  and the highest scorer speaks. Once a candidate answer exists the peers vote on
  approving it. This is the only one of the four protocols with voting.

source_config: configs/paper/broadcast_hint_llm/config.yaml

roles:
  - name: Mira
    agent_type: deliberator
    role_description: >-
      You are a calm mathematical peer who likes to decompose difficult problems
      into a few stable subgoals before committing to a conclusion. You tend to
      slow the group down just enough to reduce avoidable mistakes.
    max_retry: 10
    output_parser: dummy
    source: configs/paper/broadcast_hint_llm/config.yaml:98-119
  - name: Rowan
    agent_type: deliberator
    role_description: >-
      You are a skeptical mathematical peer who naturally looks for hidden
      assumptions, incorrect leaps, and edge cases. You do not object for the sake
      of objecting; you intervene when you think precision matters.
    max_retry: 10
    output_parser: dummy
    source: configs/paper/broadcast_hint_llm/config.yaml:121-142
  - name: Talia
    agent_type: deliberator
    role_description: >-
      You are a synthesis-oriented mathematical peer who tries to consolidate the
      group's strongest ideas into one coherent answer. You are willing to propose
      a final answer, but only when the discussion has earned it.
    max_retry: 10
    output_parser: dummy
    source: configs/paper/broadcast_hint_llm/config.yaml:144-165
  - name: Evaluator
    agent_type: evaluator
    role_description: Evaluator
    max_retry: 10
    output_parser: mgsm-evaluator
    source: configs/paper/broadcast_hint_llm/config.yaml:167-182

deliberator_prompt_budgets:
  max_public_context_tokens: 2400
  max_private_context_tokens: 600
  max_speak_history_context_tokens: 600
  max_advice_context_tokens: 2400
  max_candidate_context_tokens: 300
  max_manual_prompt_tokens: 12000
  applies_to: [Mira, Rowan, Talia]
  source: configs/paper/broadcast_hint_llm/config.yaml:105-110, 128-133, 151-156

environment:
  env_type: task-broadcast-deliberation
  max_rounds: 3
  discussion_rounds: 4
  approval_rounds: 2
  speak_threshold: 65
  memory_mode: summary_plus_recent
  recent_history_window: 5
  approval_policy: unanimous
  candidate_selection_policy: majority_revision
  reviewer_feedback_mode: hint
  source: configs/paper/broadcast_hint_llm/config.yaml:5, 80-95

turns:
  max_rounds: 3
  discussion_rounds_per_outer_round: 4
  approval_rounds_per_candidate: 2
  source: configs/paper/broadcast_hint_llm/config.yaml:5, 86-87

stopping_rule:
  outer_rule: "success OR cnt_turn >= max_rounds"
  outer_implementation: agentverse/environments/tasksolving_env/broadcast_deliberation.py:92-93
  discussion_loop: >-
    4 turns. Each turn polls ALL THREE peers in parallel (a real LLM call each,
    returning score/reason/intent/candidate_answer) and the highest scorer speaks.
    Non-speakers scoring above speak_threshold=65 record a private deferred note
    instead of speaking (capped at 8 notes).
  approval_loop: >-
    Once a candidate exists, up to 2 approval rounds; all three peers call
    aapprove_candidate in parallel, returning approve/feedback/revised_answer.
  consensus_rule: >-
    approval_policy "unanimous" means all three must approve. Consensus breaks
    both the approval loop and the discussion loop.
  source: agentverse/environments/tasksolving_env/rules/broadcast_deliberation.py:741-746, 833-862, 1014-1016, 1145, 1181-1311, 1529-1536

retry_policy:
  agent_level:
    max_retry: 10
    scope: "parse failure or any exception from the LLM call"
    on_exhaustion: "emits an empty message; deliberation continues"
    source: agentverse/agents/tasksolving_agent/deliberator.py:215
  transport_level:
    rate_limit_max_attempts: 7
    rate_limit_backoff_cap_sec: 60
    transient_max_attempts: 4
    transient_backoff_cap_sec: 8
    counted_in_tokens: false
    source: agentverse/llms/openai.py:167-172, 751-810

context_and_memory:
  memory_mode: summary_plus_recent
  recent_history_window: 5
  reset_between_outer_rounds: false
  reset_detail: >-
    Agents are reset once per problem; the rule's reset() only clears the
    evaluator and the ledgers.
  shared_transcript: "every public message is broadcast to all three peers' chat_history"
  summarization_caveat: >-
    The paper config does NOT set has_summary on the deliberators, so no summary
    is ever produced and summary_plus_recent degrades to the last 5 messages. A
    separate configs/tier6_5_test_summary_memory/ variant turns real summarization
    on; that variant is NOT the paper protocol.
  private_notes: "max_private_notes: 8"
  source: agentverse/environments/tasksolving_env/rules/broadcast_deliberation.py:290-293, 735-739; agentverse/agents/tasksolving_agent/deliberator.py:235-250, 493-499; agentverse/memory/chat_history.py:285-300

final_answer_selection:
  voting: true
  mechanisms:
    - name: unanimous_approval
      detail: "all three peers must approve a candidate for consensus"
    - name: majority_revision
      detail: >-
        Between approval rounds the next candidate is the modal revised_answer
        across the three peers (Counter.most_common(1)).
    - name: confidence_argmax_fallback
      detail: >-
        If no candidate emerged at all, a final proposal round asks all three for
        (confidence, final_answer, rationale) and takes the argmax-confidence answer.
  submission_format: >-
    "Consensus Status:" + "Candidate Source:" + "Final Answer For Evaluator:"
  source: agentverse/environments/tasksolving_env/rules/broadcast_deliberation.py:769-799, 1030, 1099-1102, 1648

evaluator_invocation:
  type: llm
  class: LlmPerEvaluator
  stateless: true
  boxed_answer_precheck: 'missing \boxed{} short-circuits to FAIL without an LLM call'
  hint_call_on_fail: true
  calls_per_outer_round: "1 verdict, plus 1 hint call if the verdict is FAIL"
  feedback_mode: hint
  source: agentverse/environments/tasksolving_env/rules/broadcast_deliberation.py:1458-1478; agentverse/environments/tasksolving_env/rules/evaluator/per.py:451-455, 479, 529-559

token_accounting:
  primitive: "usage.prompt_tokens / usage.completion_tokens accumulated per LLM instance"
  polling_is_billed: >-
    IMPORTANT: the desire-to-speak poll is a real LLM call for every peer on every
    turn, so a Broadcast round costs far more than the number of utterances
    suggests.
  memory_summarizer_tokens: "counted separately; not used here (has_summary is off)"
  per_example_total: "summed across agents; model calls = sum of total_request_count"
  per_example_isolation: "reset_token_counters() per example; see commit b4a2db6ee note in baseline.yaml"
  source:
    - agentverse/llms/openai.py:1433-1435
    - agentverse/metrics/collector.py:186-247
    - agentverse/agents/tasksolving_agent/deliberator.py:660-672

nominal_model_calls: >-
  Per outer round: 4 turns x (3 polls + 1 speak) + up to 2 approval rounds x 3
  reviews + 1 or 2 evaluator calls. Up to 3 outer rounds.

model_settings:
  llm_type: gpt-3.5-turbo   # registry alias, NOT the served model
  model: openai/gpt-oss-120b
  temperature: 0
  max_tokens: 4096
  source: configs/paper/broadcast_hint_llm/config.yaml:114-117, 137-140, 161-163, 177-180
