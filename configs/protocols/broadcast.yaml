# ===========================================================================
# PROTOCOL 4 of 4: BROADCAST (peer deliberation over a shared channel)
# ===========================================================================
# N peers with distinct mathematical temperaments deliberate on a shared
# broadcast channel. A confidence poll allocates the single speaking turn each
# round; a candidate answer must then clear an approval vote.
#
# CONTROL FLOW (one outer round)
#   for turn in range(discussion_rounds):         # discussion_rounds = 4
#       EVERY peer POLLS      -> JSON {score 1-100, reason, intent, candidate}
#       highest score SPEAKS publicly (exactly one speaker per turn)
#       peers at/above speak_threshold that did NOT win record a PRIVATE
#           deferred note, visible only to themselves on later turns
#       if a candidate emerged:
#           for r in range(approval_rounds):      # approval_rounds = 2
#               EVERY peer votes {approve, feedback, revised_answer}
#               unanimous approval -> consensus, break out of discussion
#               else candidate <- majority revision, continue
#   if no candidate at all: final proposal round, highest confidence wins
#   evaluate(final_output)
#
# COST SHAPE: the poll goes to EVERY peer on EVERY turn even though only one
# speaks, so peer count multiplies token cost without multiplying public
# output. With 3 peers / 4 discussion rounds / 2 approval rounds, a single
# outer round can reach 3*4 polls + 4 speeches + 3*2 votes = 22 actor calls.
# This is the most expensive of the four protocols.
#
# TWO MEMORY LANES PER PEER
#   public  : the shared channel, shaped by memory_mode + recent_history_window
#   private : that peer's own deferred notes, never broadcast
#
# RULE PARAMETERS IN THIS FILE
#   approval_policy                    'unanimous' = every peer must approve. 'majority' = strict majority.
#   approval_rounds                    Approval votes attempted per candidate before giving up on consensus.
#   candidate_selection_policy         How to pick a replacement when approval fails and peers proposed revisions.
#   discussion_rounds                  Poll-and-speak turns per outer round.
#   evaluator_dimensions               Field names the judge parser looks for. ONLY 'Correctness' is read at runtime; 'Verdict:' is never parsed.
#   include_hint_on_fail               On FAIL, make a SECOND judge call for a repair hint. false = one judge call total.
#   memory_mode                        How much of the shared channel each peer sees.
#   recent_history_window              Number of most-recent public messages always shown verbatim.
#   reviewer_feedback_mode             'hint' = the judge's real repair hint reaches the next attempt. 'plain' = that text is DISCARDED for a canned string.
#   speak_threshold                    Peers polling at/above this that did NOT win the turn record a private deferred note.
#   max_rounds                         Outer attempts. The loop stops the moment the evaluator returns PASS.
#
# RETRY POLICY. max_retry (per role, below) is the number of times a role's
# call+parse is retried before the turn is given up on; 10 in every paper
# config. Transport-level retry for HTTP 429/5xx is separate and lives in
# the provider config (transport.max_retries).
#
# TOKEN ACCOUNTING. Counted from the server's usage object per call, summed
# per role and in total, written to token_counts.json. Both the logical call
# count and the HTTP attempt count are recorded.
#
# EVALUATOR INVOCATION. type 'llm' for all four protocols. A box gate runs
# FIRST: no \boxed{...} in the candidate means the judge is NEVER CALLED and
# the item is recorded FAIL with direct_protocol_fail. The judge is
# gpt-oss-120b for EVERY paper run including the Gemma-solver runs -- verified
# across all 73 config.yaml files under configs/paper/.
#
# All prompt strings below are copied VERBATIM from the source config named in
# the provenance block. Placeholders use ${name} and are substituted with
# string.Template.safe_substitute; do not rename them.
#
# SCHEMA. This file carries the release-wide protocol-config schema:
#   protocol_id  display_name  roles  turns  stopping_rule  retry_policy
#   context_and_memory  final_answer_selection  evaluator_invocation
#   token_accounting
# plus a provenance: block naming the source config it was derived from.
# Anything that could not be established from source is recorded as
# `unknown: true` with a comment naming exactly where it was looked for. An
# honest gap is correct; a fabricated value is a release blocker.
#
# FOUR THINGS THAT ARE MISLEADING ON SIGHT, each verified against source:
#   1. `llm_type: gpt-3.5-turbo` in the original configs is a REGISTRY KEY,
#      not the model. It is popped before construction
#      (agentverse/initialization.py:20-23) and selects one class that is
#      registered under gpt-35-turbo / gpt-3.5-turbo / gpt-4 / vllm / local
#      (openai.py:982-986). The wire model is the separate `model:` field.
#      No GPT-3.5 was ever called.
#   2. Broadcast's `memory_mode: summary_plus_recent` NEVER SUMMARISES in
#      these runs -- see context_and_memory.summary_plus_recent_caveat.
#   3. A FAILING PER outer round submits to the evaluator TWICE -- see
#      turns.two_submissions_caveat.
#   4. Per-problem token counts from runs predating commit b4a2db6ee are
#      CUMULATIVE, not per-problem -- see
#      token_accounting.upstream_bug_caveat.
# ===========================================================================

protocol_id: broadcast
display_name: Broadcast
name: broadcast-deliberation
prompt_version: omni_math_v1
evaluator_model_config: gpt_oss_120b.yaml
max_rounds: 3
turns:
  max_rounds: 3
  discussion_rounds: 4
  approval_rounds: 2
  peers: 3
  structure: 'Per discussion turn: EVERY peer polls, the highest scorer speaks, peers at or above speak_threshold
    that did not win record a private deferred note. When a candidate exists, up to approval_rounds
    unanimous-approval votes run, each polling every peer.'
  actor_calls_per_problem: 4 .. 120
  judge_calls_per_problem: 1 .. 6
  cost_driver: The poll goes to every peer on every turn even though only one speaks, so peer count
    multiplies token cost without multiplying public output.
stopping_rule:
  approval_policy: unanimous
  rule: Consensus is reached when EVERY peer approves the current candidate in one approval round; that
    breaks out of the discussion loop. Otherwise the candidate is replaced by the majority revision
    and the next approval round runs.
  approval_source: rules/broadcast_deliberation.py:741-746 (_approval_reached)
  outer_rule: Stop on evaluator PASS, else until max_rounds.
  no_candidate_fallback: If no candidate emerged from any discussion turn, a final proposal round runs
    and the highest-confidence proposal wins.
retry_policy:
  role_call_max_retry: 10
  role_call_max_retry_source: 'configs/paper/broadcast_hint_llm/config.yaml -- `max_retry: 10` on EVERY
    agent including the evaluator. Upstream this is the number of times an agent''s generate+parse is
    retried before the turn is abandoned (agentverse/agents/tasksolving_agent/evaluator.py:85-100).'
  on_role_retry_exhausted: Upstream emits score 0 / empty advice rather than raising, so an agent that
    never parses is recorded as a wrong answer, NOT as an error. Reproduced; this port additionally
    sets judge_unparseable true so the case is auditable.
  transport_max_retries: 7
  transport_backoff: exponential with full jitter, cap 60s
  transport_retryable: HTTP 429 and 5xx, connection errors, timeouts. A non-429 4xx fails immediately.
  transport_source: agentverse/llms/openai.py:169-170 (_RATE_LIMIT_MAX_ATTEMPTS=7, _RATE_LIMIT_BACKOFF_CAP=60).
    Configurable per provider under configs/providers/*.yaml transport.max_retries.
  transport_simplification: 'SIMPLIFICATION: upstream kept a SECOND, shorter budget for transient connection
    errors (4 attempts, 8s cap, openai.py:171-172). This port uses one budget for both classes. Affects
    resilience, not content.'
  timeout_seconds: 600.0
  timeout_source: agentverse/llms/openai.py:1273 (async client timeout=600.0). NOTE the upstream SYNC
    path set no explicit timeout and stacked SDK-internal retries beneath its own; this port always
    sets both explicitly.
context_and_memory:
  question_scoped: true
  scope_note: Both ledgers are created fresh per problem and cleared between problems. Neither ever
    contains the gold answer -- only the model's own rejected answers and the judge's non-leaking hints.
  memory_mode: summary_plus_recent
  recent_history_window: 5
  two_lanes: Each peer has a PUBLIC lane (the shared broadcast channel) and a PRIVATE lane (its own
    deferred notes, never broadcast).
  summary_plus_recent_caveat: 'MISLEADING ON SIGHT. Despite the name, NO SUMMARY IS EVER PRODUCED in
    the paper''s broadcast runs. to_string_summary_last_n only prepends a ''Summary of earlier conversation''
    block when self.summary is non-empty (memory/chat_history.py:285-306), and self.summary is only
    ever written under has_summary (chat_history.py:492, gated at :89). The broadcast config gives its
    peers a bare `memory: {memory_type: chat_history}` with NO has_summary, so has_summary stays at
    its False default (chat_history.py:21) and the summary block is always the empty string. Verified
    by replicating the upstream code path on its real constants. SECOND CONSEQUENCE: with no summary,
    the visible window is set by summary_keep_recent_token_budget (default 200, chat_history.py:25)
    via _recent_tail_start_index, NOT by recent_history_window -- which is used only as a fallback when
    that tail comes back empty. So the peers'' effective context is a ~200-token tail, and the configured
    recent_history_window of 5 is largely inert.'
  speak_threshold: 65
  deferred_notes: A peer polling at or above speak_threshold that does not win the turn writes a private
    note to itself, visible only in its own later prompts.
  reviewer_feedback_mode: hint
  gemma_variant_note: The Gemma bundle uses recent_history_window 3 instead of 5. Given the caveat above,
    that difference is mostly inert too.
  simplification: 'SIMPLIFICATION, HIGHEST-RISK IN THIS PORT: upstream attached a rolling LLM-generated
    summary to some agents'' chat history (has_summary, 300-token summary refreshed every 3 messages).
    This port passes prior text explicitly through prompt placeholders and runs NO summariser. On long
    trajectories the agents therefore see materially different context, and the summariser''s own model
    calls are absent from the token totals.'
  prompt_token_budget_trimming: 'SIMPLIFICATION: upstream trimmed advice/plan/solution to per-section
    token budgets with head-tail truncation. Not implemented. Long runs will build larger prompts than
    the original.'
final_answer_selection:
  rule: The candidate surviving the approval loop is wrapped in a structured final output block (`Broadcast-Deliberation
    Final Output` with consensus status, candidate source, and `Final Answer For Evaluator:`) and that
    block is submitted.
  candidate_selection_policy: majority_revision
  candidate_selection_detail: 'When an approval round fails and peers proposed revisions, the replacement
    is the MOST COMMON revision (Counter.most_common). ''latest_revision'' and ''first_revision'' are
    the other supported policies; the paper used majority_revision. Source: rules/broadcast_deliberation.py:769-779
    (_choose_candidate).'
  poll_candidate_tiebreak: Within a discussion turn the spoken candidate wins; failing that, the highest-scoring
    poll candidate is promoted.
evaluator_invocation:
  type: llm
  implementation: agentverse/environments/tasksolving_env/rules/evaluator/per.py::LlmPerEvaluator (registered
    as 'llm', 'agent', 'openai')
  judge_model: openai/gpt-oss-120b
  judge_model_config: gpt_oss_120b.yaml
  judge_model_is_fixed_across_solver_families: true
  judge_model_evidence: 'Verified by parsing all 73 config.yaml files under configs/paper/: ZERO evaluator
    agents use any model other than openai/gpt-oss-120b. This holds for the Gemma, Llama and E4B solver
    bundles too, so the second-family comparison changes the reasoning actors without changing the answer-comparison
    mechanism.'
  box_gate:
    enabled: true
    behaviour: 'Runs BEFORE any judge call. If the submitted candidate contains no \boxed{...}, the
      judge is NEVER CALLED: the item is recorded FAIL with direct_protocol_fail true and reason missing_boxed_final_answer,
      at zero judge cost.'
    source: rules/evaluator/per.py:179-202 (box_required = True)
    consequence: A pure formatting failure is indistinguishable in the outcome from a wrong answer,
      and is cheaper.
  calls_per_evaluation: 1 on PASS, 2 on FAIL
  hint_call:
    include_hint_on_fail: true
    behaviour: 'On FAIL a SECOND judge call generates the repair hint, with the correctness verdict
      explicitly PINNED so the second call cannot overturn the first. Source: rules/evaluator/per.py:534-571.'
  verdict_parsing:
    parser: mgsm-evaluator
    dimensions_read:
    - Correctness
    caveat: 'MISLEADING ON SIGHT. Every judge prompt demands a `Verdict: PASS|FAIL` line, but the runtime
      parser reads ONLY `Correctness:\s*(\d)` (output_parser.py:515-546). The Verdict line is decorative
      at run time and is consumed only by offline analysis, and only as a fallback when Correctness
      is absent. On a contradiction, Correctness wins.'
    single_digit_quirk: 'The regex captures ONE digit, so `Correctness: 10` parses as 1 (True). Preserved.'
  reference_solution_visibility: The gold answer and, where present, the official solution are given
    to the JUDGE ONLY. The judge is instructed not to reveal, quote or restate them, and the returned
    hint is required to be non-leaking. No actor prompt ever contains the gold answer.
token_accounting:
  counted_from: 'the server''s `usage` object on each response: prompt_tokens, completion_tokens, total_tokens'
  source: agentverse/llms/openai.py:1167-1169 and :1433-1435 (collect_metrics); per-instance accumulators
    at :994-996
  granularity: summed per ROLE and in total; written to token_counts.json in every run directory
  reset_between_problems: true
  reset_source: agentverse/tasksolving.py:320-321 calls environment.reset_token_counters() per example
    (agentverse/environments/base.py:94-126).
  upstream_bug_fixed_at_commit: b4a2db6ee53811b1a578972421da6a9cc2a18286
  upstream_bug_caveat: 'MISLEADING ON SIGHT. Before commit b4a2db6ee ("Fix per-example resource accounting:
    reset LLM token counters per example", 2026-07-24), the benchmark loop reused ONE TaskSolving object
    across examples while the LLM counters only ever accumulated with +=. MetricsCollector.snapshot_agent_tokens
    therefore recorded CUMULATIVE within-worker totals as if they were per-problem. Any per-problem
    cost figure taken from a run predating that commit is inflated and monotonically increasing within
    a shard. Verified: commit exists in the AgentVerse repository, and the fix is documented in the
    reset_token_counters docstring at environments/base.py:96-105.'
  http_attempts_recorded: true
  http_attempts_rationale: DEVIATION FROM UPSTREAM, deliberate. Upstream increments total_request_count
    once per LOGICAL call (openai.py:1141 etc), so HTTP retries are invisible and a cost estimate built
    on it understates a rate-limited run. This port records BOTH `calls` and `http_attempts`.
  known_undercount: This port omits the rolling-summary model calls (see context_and_memory.simplification),
    so for PER its token totals are an UNDERCOUNT relative to the original engine. Do not compare token
    counts from this port against the paper's.
rule:
  approval_policy: unanimous
  approval_rounds: 2
  candidate_selection_policy: majority_revision
  discussion_rounds: 4
  evaluator_dimensions:
  - Correctness
  include_hint_on_fail: true
  memory_mode: summary_plus_recent
  recent_history_window: 5
  reviewer_feedback_mode: hint
  speak_threshold: 65
peers:
- name: Mira
  role_description: You are a calm mathematical peer who likes to decompose difficult problems into
    a few stable subgoals before committing to a conclusion. You tend to slow the group down just enough
    to reduce avoidable mistakes.
- name: Rowan
  role_description: You are a skeptical mathematical peer who naturally looks for hidden assumptions,
    incorrect leaps, and edge cases. You do not object for the sake of objecting; you intervene when
    you think precision matters.
- name: Talia
  role_description: You are a synthesis-oriented mathematical peer who tries to consolidate the group's
    strongest ideas into one coherent answer. You are willing to propose a final answer, but only when
    the discussion has earned it.
roles:
  deliberator:
    name: <peer name, see peers:>
    agent_type: deliberator
    max_retry: 10
    max_tokens: 4096
    output_parser: dummy
    memory_type: chat_history
    max_public_context_tokens: 2400
    max_private_context_tokens: 600
    max_speak_history_context_tokens: 600
    max_advice_context_tokens: 2400
    max_candidate_context_tokens: 300
    max_manual_prompt_tokens: 12000
    prepend_prompt: |-
      You are one peer in a small math deliberation group.

      Problem:
      ${task_description}

      Outer-loop feedback from the evaluator or prior attempt:
      ${advice}

      Current shared candidate answer:
      ${candidate_answer}

      Your mathematical temperament:
      ${role_description}

      Your private deferred notes:
      ${private_memory}

      Current turn label:
      ${current_turn_label}

      Your own speaking history in this run:
      ${own_speak_history}

      Current phase:
      ${phase}

      Phase instruction:
      ${phase_instruction}
    append_prompt: |-
      Use the shared chat history above to stay consistent with the ongoing discussion.
      Be concise, concrete, and mathematically serious.
      Omni-MATH final answers are not always plain numbers. A valid answer may be a symbolic expression, formula, set, interval, condition, equality, or inequality.
      Do not role-play a rigid planner / executor / reviewer pipeline.
      When the system asks for a confidence poll, you must provide an integer confidence score from 1 to 100 in the required structured format.
      If you want the group to consider a concrete final answer, include:
      Candidate Answer:
      \boxed{<answer>}
  evaluator:
    name: Evaluator
    agent_type: evaluator
    role_description: Evaluator
    max_retry: 10
    max_tokens: 4096
    output_parser: mgsm-evaluator
    memory_type: chat_history
    prepend_prompt: |-
      You are the Evaluator for a multi-agent math deliberation system.

      Problem:
      ${task_description}

      MAS final submission:
      ${solution}

      Ground truth / evaluator-only reference material:
      ${result}

      Requirements:
        - Decide whether the MAS final answer is mathematically equivalent to the ground truth.
        - Focus on the final answer, not stylistic wording.
        - The reference material may include both the final answer and an official solution. Use the official solution only to understand the intended reasoning and diagnose mismatch type.
        - The repair hint must be tailored to the current extracted MAS final answer, the ground-truth final answer, and the official solution. Do not recycle a previous hint unless the current final answer and mismatch type are unchanged.
        - If the current final answer changed, diagnose the new mismatch type, for example wrong value, incomplete list, placeholder, wrong answer shape, missing cases, or insufficient generality.
        - The final answer may be numeric, symbolic, formulaic, set-valued, or conditional.
        - If the submission gives isolated numbers/examples but the problem asks for all objects, a formula/equation, a condition, or a classification, the hint should explicitly flag an answer-shape or generality mismatch without naming the missing answer.
        - For prompts such as "find all", "for each", "all positive integers", "all functions", or "explicit form", check that the answer is a complete universal statement/family, not just tested cases.
        - Do not reveal, quote, restate, or hint at the ground truth or official solution in your response.
        - Output a clear verdict label: `Verdict: PASS` or `Verdict: FAIL`.
        - If the answer is equivalent, output `Correctness: 1`.
        - Otherwise output `Correctness: 0` and give a short non-leaking repair hint. When relevant, name answer-shape or generality mismatch, such as an over-specific numeric answer when a general condition/equation/family is required.
    append_prompt: |-
      Output format:
      Verdict: PASS or FAIL
      Correctness: 0 or 1
      Response: <brief non-leaking repair hint; mention answer-shape/generality if relevant, without revealing the gold answer>
provenance:
  derived_from_config: AgentVerse/configs/paper/broadcast_hint_llm/config.yaml
  derived_from_benchmark: AgentVerse/configs/paper/broadcast_hint_llm/benchmark.yaml
  upstream_env_type: task-broadcast-deliberation
  upstream_rule_class: agentverse/environments/tasksolving_env/rules/broadcast_deliberation.py::BroadcastDeliberationRule
  upstream_evaluator_type: llm
  upstream_evaluator_class: agentverse/environments/tasksolving_env/rules/evaluator/per.py::LlmPerEvaluator
  upstream_output_parsers:
    deliberator: dummy
    evaluator: mgsm-evaluator
  prompts_copied_verbatim: true
  port_location: src/protocol_routing_exec/protocols.py
  gemma_variant_differences: configs/paper/different_model_family/*_gemma4_31b_eval_oss120b/config.yaml
    uses IDENTICAL prompts and rule structure but actor max_tokens 2048 instead of 4096, recent_history_window
    3 instead of 5. The evaluator stays gpt-oss-120b at max_tokens 4096 in every variant.
  llm_type_caveat: 'The source configs set `llm_type: gpt-3.5-turbo` on every agent. That is a REGISTRY
    KEY selecting the OpenAIChat class, popped before construction (agentverse/initialization.py:20-23);
    the class is registered under five aliases (openai.py:982-986). The wire model is the separate `model:`
    field. No GPT-3.5 was ever called.'
