# ===========================================================================
# PROTOCOL 2 of 4: SINGLE (single-agent iterative self-correction)
# ===========================================================================
# One solver retries its own answer, up to max_rounds attempts, guided by the
# judge's non-leaking repair hint. No second agent is involved.
#
# CONTROL FLOW (one outer round)
#   solver(problem, question_scoped_memory) -> candidate
#   evaluate(candidate)          # box gate; on FAIL a SECOND judge call
#                                # produces the repair hint
#   PASS -> stop.  FAIL -> record the rejected answer + hint, loop.
#
# CONTEXT RESET IS THE DEFINING PROPERTY
#   reset_solver_memory_each_attempt: true. The solver's chat transcript is
#   cleared before every attempt. The ONLY thing carried between attempts is
#   the structured question-scoped ledger (rejected answers + judge hints),
#   injected through ${advice}. This is what makes "one agent iterating"
#   different from "one long conversation".
#
# FIRST ATTEMPT USES A DIFFERENT PROMPT PAIR
#   There is no prior answer or feedback on attempt 1, so the solver gets
#   first_attempt_prepend_prompt / first_attempt_append_prompt instead.
#
# RULE PARAMETERS IN THIS FILE
#   evaluator_dimensions               Field names the judge parser looks for. ONLY 'Correctness' is read at runtime; 'Verdict:' is never parsed.
#   include_hint_on_fail               On FAIL, make a SECOND judge call for a repair hint. false = one judge call total.
#   reset_solver_memory_each_attempt   Clear the solver transcript before each attempt; only the structured ledger carries over.
#   reviewer_feedback_mode             'hint' = the judge's real repair hint reaches the next attempt. 'plain' = that text is DISCARDED for a canned string.
#   max_rounds                         Outer attempts. The loop stops the moment the evaluator returns PASS.
#
# RETRY POLICY. max_retry (per role, below) is the number of times a role's
# call+parse is retried before the turn is given up on; 10 in every paper
# config. Transport-level retry for HTTP 429/5xx is separate and lives in
# the provider config (transport.max_retries).
#
# TOKEN ACCOUNTING. Counted from the server's usage object per call, summed
# per role and in total, written to token_counts.json. Both the logical call
# count and the HTTP attempt count are recorded.
#
# EVALUATOR INVOCATION. type 'llm' for all four protocols. A box gate runs
# FIRST: no \boxed{...} in the candidate means the judge is NEVER CALLED and
# the item is recorded FAIL with direct_protocol_fail. The judge is
# gpt-oss-120b for EVERY paper run including the Gemma-solver runs -- verified
# across all 73 config.yaml files under configs/paper/.
#
# All prompt strings below are copied VERBATIM from the source config named in
# the provenance block. Placeholders use ${name} and are substituted with
# string.Template.safe_substitute; do not rename them.
# ===========================================================================

protocol_id: single
name: single-agent-reflect
prompt_version: omni_math_v1
evaluator_model_config: gpt_oss_120b.yaml
max_rounds: 3
rule:
  evaluator_dimensions:
  - Correctness
  include_hint_on_fail: true
  reset_solver_memory_each_attempt: true
  reviewer_feedback_mode: hint
roles:
  solver:
    name: Solo
    agent_type: solver
    role_description: SingleAgentIterative
    max_retry: 10
    max_tokens: 4096
    output_parser: dummy
    memory_type: chat_history
    prepend_prompt: |-
      You are an experienced educator in the field of MATHEMATICS.

      Problem:
      ${task_description}

      Previous submitted answer from this question (may be empty):
      ${former_solution}

      Question-scoped memory for this question:
      ${advice}

      Instructions:
      - Solve the problem directly and give your current best complete solution.
      - Use the question-scoped memory only to avoid repeating rejected answers and to incorporate evaluator feedback. It does not reveal the gold answer.
      - Infer the required answer shape from the problem statement before committing to a final answer.
      - The final answer may be a number, fraction, algebraic formula, set/list of tuples, family of functions, condition, or symbolic statement such as `n \\neq 5`.
      - If the problem asks for all solutions / all functions / explicit form / all valid integers, do not answer with only one example or one tested case.
      - Prefer exact symbolic forms over decimals unless approximation is explicitly requested.
      - Your final TWO non-empty lines MUST be exactly:
        `Final Answer: <answer>`
        `\\boxed{<answer>}`
      - The final boxed line must contain ONLY `\\boxed{<answer>}` and nothing else.
      - Do NOT wrap the final boxed answer in `\\(` `\\)` `$` `$$` `\\[` `\\]`, `\\text{}`, or any other extra formatting.
      - Do NOT put `\\boxed{...}` on the same line as `Final Answer:`.
      - If you do not follow this exact two-line format, the evaluator may treat the final answer as missing.
    append_prompt: |-
      Be concise but mathematically complete.
      Do not output more than one boxed final answer.
      Do not end with discussion text after the boxed final answer.
      End exactly with:
      Final Answer: <answer>
      \boxed{<answer>}
    first_attempt_prepend_prompt: |-
      You are an experienced educator in the field of MATHEMATICS.

      Problem:
      ${task_description}

      Instructions:
      - Solve the problem directly and give your best final answer in one attempt.
      - Infer the required answer shape from the problem statement before committing to a final answer.
      - The final answer may be a number, fraction, algebraic formula, set/list of tuples, family of functions, condition, inequality, or symbolic statement such as `n \\neq 5`.
      - If the problem asks for all solutions / all functions / explicit form / all valid integers, do not answer with only one example or one tested case.
      - Prefer exact symbolic forms over decimals unless approximation is explicitly requested.
      - Your final TWO non-empty lines MUST be exactly:
        `Final Answer: <answer>`
        `\\boxed{<answer>}`
      - The final boxed line must contain ONLY `\\boxed{<answer>}` and nothing else.
      - Do NOT wrap the final boxed answer in `\\(` `\\)` `$` `$$` `\\[` `\\]`, `\\text{}`, or any other extra formatting.
      - Do NOT put `\\boxed{...}` on the same line as `Final Answer:`.
      - If you do not follow this exact two-line format, the evaluator may treat the final answer as missing.
    first_attempt_append_prompt: |-
      Be concise but mathematically complete.
      Do not output more than one boxed final answer.
      Do not end with discussion text after the boxed final answer.
      End exactly with:
      Final Answer: <answer>
      \boxed{<answer>}
  evaluator:
    name: Evaluator
    agent_type: evaluator
    role_description: Evaluator
    max_retry: 10
    max_tokens: 4096
    output_parser: mgsm-evaluator
    memory_type: chat_history
    prepend_prompt: |-
      You are the Evaluator for a Baseline LLM math reasoning benchmark.

      Problem:
      ${task_description}

      Solver final submission:
      ${solution}

      Ground truth / evaluator-only reference material:
      ${result}

      Requirements:
        - Decide whether the final answer is mathematically equivalent to the ground truth.
        - Focus on the final answer, not stylistic wording.
        - The reference material may include both the final answer and an official solution. Use the official solution only to understand the intended reasoning and diagnose mismatch type.
        - The repair hint must be tailored to the current extracted final answer, the ground-truth final answer, and the official solution. Do not recycle a generic hint unless the current final answer and mismatch type are unchanged.
        - If the current final answer changed, diagnose the new mismatch type, for example wrong value, incomplete list, placeholder, wrong answer shape, missing cases, or insufficient generality.
        - The ground truth may be a number, fraction, algebraic expression, formula, set/list of answers, family of functions, inequality, or symbolic condition.
        - If the submission gives isolated numbers/examples but the problem asks for all objects, a formula/equation, a condition, or a classification, explicitly flag an answer-shape or generality mismatch without naming the missing answer.
        - For prompts such as "find all", "for each", "all positive integers", "all functions", or "explicit form", check that the answer is a complete universal statement/family, not just tested cases.
        - Treat mathematically equivalent formulas, reordered sets, and equivalent quantified statements as correct.
        - Do not reveal, quote, restate, or hint at the ground truth or official solution in your response.
        - Output a clear verdict label: `Verdict: PASS` or `Verdict: FAIL`.
        - If the answer is equivalent, output `Correctness: 1`.
        - Otherwise output `Correctness: 0` and give a short non-leaking repair hint that names the kind of mismatch without revealing the ground truth, for example: wrong answer type, incomplete family, missing cases, only an example, over-specific numeric answer when a general condition/equation/family is required, unsupported generalization, or formatting/boxing issue.
    append_prompt: |-
      Output format:
      Verdict: PASS or FAIL
      Correctness: 0 or 1
      Response: <brief non-leaking repair hint; mention answer-shape/generality if relevant, without revealing the gold answer>
provenance:
  derived_from_config: AgentVerse/configs/paper/single_agent_hint_llm/config.yaml
  derived_from_benchmark: AgentVerse/configs/paper/single_agent_hint_llm/benchmark.yaml
  upstream_env_type: task-single-agent-reflect
  upstream_rule_class: agentverse/environments/tasksolving_env/rules/single_agent_reflect.py::SingleAgentReflectRule
  upstream_evaluator_type: llm
  upstream_evaluator_class: agentverse/environments/tasksolving_env/rules/evaluator/per.py::LlmPerEvaluator
  upstream_output_parsers:
    solver: dummy
    evaluator: mgsm-evaluator
  prompts_copied_verbatim: true
  port_location: src/protocol_routing_exec/protocols.py
  gemma_variant_differences: configs/paper/different_model_family/*_gemma4_31b_eval_oss120b/config.yaml
    uses IDENTICAL prompts and rule structure but actor max_tokens 2048 instead of 4096. The evaluator
    stays gpt-oss-120b at max_tokens 4096 in every variant.
