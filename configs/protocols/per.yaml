# PER protocol -- planner / executor / reviewer pipeline.
#
# PROVENANCE. Transcribed from the AgentVerse execution configs and code that
# produced the released outcomes; `source:` keys give repository-relative
# paths. Nothing is inferred. Unestablished fields carry `unknown: true`.
#
# THIS FILE DOES NOT EXECUTE ANYTHING (offline analysis package).

protocol_id: planner_executor_reviewer
aliases: [per]   # the short-paper benchmark CSV spells this protocol "per"
display_name: PER
description: >-
  A Planner decomposes the problem without computing, an Executor performs the
  computation, and a Reviewer routes control back to either of them or agrees to
  submit. Up to three outer rounds, each containing two inner planner/executor/
  reviewer iterations and, on failure, an in-round repair pass.

source_config: configs/paper/per_hint_llm/config.yaml

roles:
  - name: Planner
    agent_type: solver
    role_description: Planner
    max_retry: 10
    output_parser: mgsm
    role_constraint: >-
      "You MUST NOT carry out symbolic manipulation or arithmetic yourself...
      Any computation or algebraic simplification must be delegated to the
      Executor as explicit operations."
    memory:
      memory_type: chat_history
      has_summary: true
      max_summary_tlength: 300
      summary_model: openai/gpt-oss-120b
      summary_update_every_n_messages: 3
      summary_keep_last_n_messages: 0
      summary_keep_recent_token_budget: 200
    source: configs/paper/per_hint_llm/config.yaml:26-29, 201-222
  - name: Executor
    agent_type: executor
    max_retry: 10
    output_parser: mgsm
    memory:
      memory_type: chat_history
      has_summary: false
    runs_history_free: true
    runs_history_free_detail: >-
      Called with disable_chat_history=True because embed_action_feedback_in_history
      defaults to False and the config does not enable it.
    source: configs/paper/per_hint_llm/config.yaml:224-239, agentverse/environments/tasksolving_env/rules/per.py:590-592, 1538
  - name: Reviewer
    agent_type: critic
    max_retry: 10
    output_parser: mgsm-critic-route
    routing_contract: >-
      "End with EXACTLY ONE tag on the last line:
       [Route:Planner] OR [Route:Executor] OR [Agree]"
    memory:
      memory_type: chat_history
      has_summary: true
      max_summary_tlength: 300
      summary_model: openai/gpt-oss-120b
      summary_update_every_n_messages: 3
      summary_keep_last_n_messages: 0
      summary_keep_recent_token_budget: 200
    source: configs/paper/per_hint_llm/config.yaml:146-147, 241-262
  - name: Evaluator
    agent_type: evaluator
    max_retry: 10
    output_parser: mgsm-evaluator
    source: configs/paper/per_hint_llm/config.yaml:264-279

agent_count:
  reviewers: 1
  detail: >-
    PER forces exactly one reviewer rather than a critic group; the `cnt_agents`
    field is NOT used by any of the four paper protocols (it appears only in
    legacy task configs and in the unrelated DHD configs).
  source: agentverse/tasksolving.py:139-141

environment:
  env_type: task-per
  max_rounds: 3
  inner_rounds: 2
  stop_on_agree: true
  reviewer_feedback_mode: hint
  failed_attempt_memory_limit: 3
  candidate_revision_memory_limit: 5
  evaluator_data_name: omni-math
  source: configs/paper/per_hint_llm/config.yaml:8-9, 183-197

turns:
  max_rounds: 3
  inner_rounds: 2
  source: configs/paper/per_hint_llm/config.yaml:8-9

stopping_rule:
  outer_rule: "success OR cnt_turn >= max_rounds"
  outer_implementation: agentverse/environments/tasksolving_env/per.py:77-79
  inner_loop: >-
    Two iterations of Planner -> Executor -> Reviewer. The inner loop breaks
    early when the reviewer's route tag is "agree" or "evaluate"
    (stop_on_agree: true).
  inner_implementation: agentverse/environments/tasksolving_env/rules/per.py:954, 971, 1010, 1126, 1185-1186
  route_parse_default: >-
    An unparseable or empty reviewer tag defaults to "executor", NOT to agree.
  route_parse_source: agentverse/environments/tasksolving_env/rules/per.py:183-201
  in_round_repair_pass: >-
    IMPORTANT: a FAILED evaluator submission triggers a second, in-round repair
    pass (repair Planner -> repair Executor -> repair Reviewer) and a SECOND
    evaluator submission in the same outer round. One outer round can therefore
    contain two evaluator submissions.
  in_round_repair_source: agentverse/environments/tasksolving_env/rules/per.py:1417-1422, 1471, 1533, 1604, 1660-1665; agentverse/environments/tasksolving_env/per.py:23
  forced_route_on_fail: >-
    If the reviewer emits no repair route after a failure, one is injected by a
    keyword heuristic.
  forced_route_source: agentverse/environments/tasksolving_env/rules/per.py:252-290

retry_policy:
  agent_level:
    max_retry: 10
    scope: "parse failure or any exception from the LLM call"
    on_exhaustion: "emits an empty message; the round continues"
    source: agentverse/agents/tasksolving_agent/{solver,executor,critic,evaluator}.py
  transport_level:
    rate_limit_max_attempts: 7
    rate_limit_backoff_cap_sec: 60
    transient_max_attempts: 4
    transient_backoff_cap_sec: 8
    counted_in_tokens: false
    source: agentverse/llms/openai.py:167-172, 751-810

context_and_memory:
  reset_between_outer_rounds: false
  reset_detail: >-
    Agents are reset ONCE PER PROBLEM, not between outer rounds; the rule's
    reset() only clears the evaluator and the ledgers.
  shared_history: >-
    Planner and Reviewer share broadcast history. The Executor is excluded and
    runs history-free.
  planner_reviewer_context: "rolling summary + recent (has_summary: true)"
  ledgers:
    failed_attempt_memory_limit: 3
    candidate_revision_memory_limit: 5
    reset_scope: per problem
  source: agentverse/environments/tasksolving_env/rules/per.py:61-93, 598-607, 633-636, 1526, 1538; agentverse/environments/tasksolving_env/per.py:90-95

final_answer_selection:
  rule: 'current_candidate or latest_reviewer_output or "[No candidate submitted]"'
  candidate_origin: >-
    current_candidate is set from the Reviewer's "Final Answer For Evaluator:"
    block when it agrees, otherwise from Executor output.
  voting: false
  reviewer_override: >-
    An allow_reviewer_override escape hatch exists (turn a FAIL into a pass on
    "[Agree]") but is DISABLED: the config does not set it and the default is False.
  source: agentverse/environments/tasksolving_env/rules/per.py:520-538, 588, 1151-1160, 1696-1701, 1734

evaluator_invocation:
  type: llm
  class: LlmPerEvaluator
  stateless: true
  boxed_answer_precheck: 'missing \boxed{} short-circuits to FAIL without an LLM call'
  hint_call_on_fail: true
  submissions_per_outer_round: "1 or 2 (see in_round_repair_pass)"
  feedback_mode: hint
  source: agentverse/environments/tasksolving_env/rules/evaluator/per.py:451-455, 170-207, 479, 510-516, 529-559

token_accounting:
  primitive: "usage.prompt_tokens / usage.completion_tokens accumulated per LLM instance"
  memory_summarizer_tokens: >-
    COUNTED, and material for PER: Planner and Reviewer have has_summary: true, so
    the summarizer's own calls add to both tokens and model-call counts.
  per_example_total: "summed across agents; model calls = total_request_count + summary_request_count"
  per_example_isolation: "reset_token_counters() per example; see commit b4a2db6ee note in baseline.yaml"
  source:
    - agentverse/llms/openai.py:1433-1435
    - agentverse/memory/chat_history.py:477-489
    - agentverse/metrics/collector.py:186-247

nominal_model_calls: >-
  Up to 3 outer rounds x (2 inner x 3 agents + up to 2 evaluator submissions +
  up to 3 repair-pass agent calls), plus summarizer calls. A first-round pass
  was observed at 12 total model calls in the released traces.

model_settings:
  llm_type: gpt-3.5-turbo   # registry alias, NOT the served model
  model: openai/gpt-oss-120b
  temperature: 0
  max_tokens: 4096
  source: configs/paper/per_hint_llm/config.yaml:217-220, 234-237, 257-260
