name: tests

on:
  push:
    branches: [main, public-release]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Import check
        run: python -c "import protocol_routing; print(protocol_routing.__version__)"

      - name: Test suite
        run: pytest -q

      # The smoke path must never need a download, a GPU, or a model endpoint.
      - name: Smoke (fixture only, offline)
        run: make smoke

      # The dataset validator ships to users who may have nothing installed.
      # It must run on a bare interpreter, so check it without the test extras.
      - name: Validator runs without pandas or numpy
        run: |
          python - <<'PY'
          import importlib.util, sys
          for mod in ("pandas", "numpy"):
              if importlib.util.find_spec(mod) is not None:
                  print(f"NOTE: {mod} is installed in this job; "
                        "the bare-interpreter guarantee is asserted by tests, not here.")
          PY
